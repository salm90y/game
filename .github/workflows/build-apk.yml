name: Build Android APK (PS1 Netplay)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Setup Native Dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Download official Libretro PS1 cores
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://buildbot.libretro.com/nightly/android/latest"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64

          download_core() {
            local abi="$1"
            local zip="/tmp/mednafen-${abi}.zip"
            local dir="android/app/src/main/jniLibs/${abi}"
            curl --fail --location --retry 3 --silent --show-error \
              "${BASE}/${abi}/mednafen_psx_hw_libretro_android.so.zip" -o "$zip"
            unzip -j -o "$zip" '*.so' -d "$dir"
            # Android's native library packager expects the conventional lib*.so name.
            if [ -f "$dir/mednafen_psx_hw_libretro_android.so" ]; then
              mv "$dir/mednafen_psx_hw_libretro_android.so" "$dir/libmednafen_psx_hw_libretro_android.so"
            fi
            test -s "$dir/libmednafen_psx_hw_libretro_android.so"
          }

          download_core arm64-v8a
          download_core armeabi-v7a
          download_core x86_64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS1-Netplay-Combat3-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
